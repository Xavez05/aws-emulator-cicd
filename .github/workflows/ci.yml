name: CI con AWS Emulator

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen del emulador
        run: docker build -t aws-emulator-cicd .

      - name: Iniciar el emulador
        run: |
          mkdir -p "$HOME/.aws/emulator"
          docker run -d --name emulator \
            --memory=2g --memory-swap=2g \
            -p 127.0.0.1:9297:9297 \
            --user "$(id -u):$(id -g)" \
            -e HOME="$HOME" \
            -v "$HOME/.aws/emulator:$HOME/.aws/emulator" \
            aws-emulator-cicd -p 9297

      - name: Esperar a que el emulador responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health; then
              echo
              echo "Emulador listo"
              exit 0
            fi
            sleep 1
          done
          echo "El emulador no arrancó"
          docker logs emulator
          exit 1

      - name: Configurar el AWS CLI para usar el emulador
        run: |
          echo "AWS_ENDPOINT_URL=https://127.0.0.1:9297" >> "$GITHUB_ENV"
          echo "AWS_SHARED_CREDENTIALS_FILE=$HOME/.aws/emulator/9297/emulator_credentials" >> "$GITHUB_ENV"
          echo "AWS_CONFIG_FILE=$HOME/.aws/emulator/9297/config" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=$HOME/.aws/emulator/9297/ca.pem" >> "$GITHUB_ENV"
          echo "AWS_EC2_METADATA_DISABLED=true" >> "$GITHUB_ENV"

      - name: Desplegar con CloudFormation
        run: aws cloudformation deploy --stack-name mi-stack --template-file template.yaml

      - name: Ejecutar la prueba
        run: bash tests/smoke-test.sh

      - name: Mostrar logs del emulador si algo falló
        if: failure()
        run: docker logs emulator
